<!DOCTYPE html>
<html>

<head>
    <title>Uber</title>
    <style>
    

        .cat,.tiger,.dog {
            width: 300px;
            height: 300px;
            object-fit: cover;
            vertical-align: top;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            font-family: Arial;
            text-align: left;
            margin-top: 4px;
            margin-left: 8px;
            margin-bottom: 0px;
            width: 280px;
            vertical-align: top;

        }

        .number-friend {
            font-size: 18px;
            color: rgba(128, 128, 128, 0.872);
            font-family: Arial;
            font-weight: bold;
            display: inline-block;
            vertical-align: middle;
            margin-left: 4px;
            margin-top: 4px;
            margin-bottom: 0;
        }

        .friend {
            font-size: 14px;
            color: white;
            font-family: Arial;
            font-weight: bold;
            background-color: rgb(47, 126, 238);
            border-radius: 4px;
            width: 140px;
            height: 40px;
            text-align: center;
            margin-top: 4px;
            margin-left: 8px;
            margin-bottom: 4px;   
            display: block;
        }
        .small {
            width: 38px;
            height: 38px;
            border-radius: 50px;
            display: inline-block;
            vertical-align: middle;
            margin-top:0px;
            margin-left: 8px;
            margin-bottom: 0;
        }
        .place{
        margin-top: 0px;
        vertical-align: middle;
        display: inline-block;
        }

    </style>
</head>

<body>
    <div style="display:grid;
    grid-template-columns:300px 300px 300px;
    column-gap: 20px;
    ">
        <div style="box-shadow: 10px  10px 20px rgba(0, 0, 0, 0.25);
        "><img class=cat src="images/Cat.JPG">
        <p class="title">cat</p>
       <div class="place">
            <img class="small" src="images/dog.jpeg"> 
            <p class="number-friend">2 mutual friends</p></div>
        <button class="friend">Add Friend</button>
    </div> 
        <div style="box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.25);        
        ">    
        <img class=tiger src="images/tiger.jpeg">
        <p class="title">tiger</p>
        <div class="place">
        <img class="small" src="images/tiger.jpeg">
        <p class="number-friend"> 3 mutual friends</p></div>
        <button class="friend">Add Friend</button></div>
         
        <div style="box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.25);
"><img class=dog src="images/dog.jpeg">
        <p class="title">dog</p>
       <div class="place">
       <img class="small" src="images/Cat.JPG">
        <p class="number-friend"> 5 mutual friends</p></div>
        <button class="friend">Add Friend</button></div>
    </div>
</body>

</html>
