<!DOCTYPE html>
<html>
    <head> 
        <title>Uber</title>
        <style>
            
            .site{
                width:280px;
                height: 410px;
                border-color: rgba(128, 128, 128, 0.21);
                box-shadow: 10px 10px 20px rgba(128, 128, 128, 0.49);
                display: inline-block;
            }
            .cat{
                width:280px;
                height:280px;
                object-fit: cover;
                display:inline-block;
            }
            .title{
                font-size: 20px;
                font-weight: bold;
                font-family: Arial;
                display: inline-block;
                text-align: lift;
                margin-top: 12px;
                margin-left: 8px;
                margin-bottom: 4px;
                width:280px;

            }
            .number-friend{
                font-size: 14px;
                color: rgba(128, 128, 128, 0.872);
                font-family: Arial;
                font-weight: bold;
                display: block;
                text-align: lift;
                margin-top: 4px;
                margin-left: 8px;
                width:280px;

            
            }
            .friend{
                font-size: 14px;
                color: white;
                font-family: Arial;
                font-weight: bold;
                background-color: rgb(47, 126, 238);
                border-radius: 8px;
                display: block;
                width: 140px;
                height: 40px;
                text-align: lift;
                margin-top: 2px;
                margin-left: 8px;
            }
            .tiger{
                width:280px;
                height:280px;
                object-fit: cover;
                display:inline-block;           
            }
            .title-2{
                font-size: 20px;
                font-weight: bold;
                font-family: Arial;
                display: inline-block;
                text-align: lift;
                margin-top: 12px;
                margin-left: 8px;
                margin-bottom: 4px;
                width:280px;
            }

 
        </style>
    </head>
    <body>
        <div class="site">
            <img class= cat src="images/Cat.JPG">
           <p class="title">cat</p>
           <p class="number-friend"> 2 mutual friends</p>
            <button class="friend">Add Friend</button>

            <img class= tiger src="images/tiger.jpeg">
           <p class="title-2">tiger</p>
           <p class="number-friend-2"> 3 mutual friends</p>
            <button class="friend-2">Add Friend</button>

</div>
    </body>
</html>
