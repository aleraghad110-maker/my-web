<!DOCTYPE html>
<html>
    <head> <title> Cat</title></head>
    <style>
        .p{
            font-family: Arial;
        }
        .all-inform{
            width: 400px;
            height: 180px;
            margin-bottom: 40px;
        }
        
        .image{
            width: 45px;
            height: 40px;
            border-radius: 25px;
            object-fit: cover;
            margin-top: 0;
            vertical-align: top;
            display: inline-block;
        }
        .name-animal{
            font-size: 14px; 
            margin-bottom:0;
            margin-top: 0;
            vertical-align: top;
        }
        .type-animal{
            font-size: 14px;
            color: rgb(173, 167, 167);

            margin-top: 0;
            vertical-align: top;
        }
        .state{
            font-size: 14px;
            color: rgb(173, 167, 167);
            margin-bottom: 0;
            margin-top: 0;
            vertical-align: top;
        }
        .ask{
            font-size: 14px;
            font-weight: 700;
            color:white;
            background-color: rgb(43, 128, 225);
            width: 70px;
            height: 25px;
            border-radius: 4px;
            margin-bottom: 8px;
            margin-left: 100px;
            vertical-align: middle;
        }
        .img-place{
            margin-top: 0;
            display: inline-block;
            vertical-align: middle;
            margin-bottom: 8px;
        }
        .content{
            font-size: 14px;
            vertical-align: middle;
            margin-bottom: 8px;
            margin-left: 8px;
            display: inline-block;  
        }

    </style>
    <body>
        <div class="all-inform">
     <div class="img-place"><img class="image" src="images/Cat.JPG"> </div>

        <div class="all-inform">
